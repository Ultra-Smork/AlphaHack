services:
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8000"
      DATABASE_URL: sqlite:////app/data/alphahack.db
      DROP_ON_START: "false"
      JWT_SECRET: dev-insecure-change-me
      JWT_TTL: 24h
      ML_MODE: engine
      ML_BASE_URL: http://localhost:8001
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
